name: Playwright Semantics Smoke

# Portable smoke on GitHub-hosted ubuntu-latest (CI_HOSTED_RUNNER).
# Path detect / wait / smoke-run / required gate all hosted by default.
# NEVER macos-latest / larger / paid runners.
#
# Prefer leaving CI_HOSTED_RUNNER unset while public. Fork PRs refuse self-hosted.
# wait-ci-flutter still yields to same-SHA Flutter before smoke starts.

#
# No workflow-level paths-ignore: required check flutter-web-semantics-smoke always reports.
# Heavy smoke job is path-filtered; gate reports success on backend/docs-only skips.
# merge_group: required smoke gate must run in the GitHub merge queue (deploy does not).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel superseded runs on the same PR/branch. Never cancel main.
# deploy.yml stays cancel-in-progress: false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  FLUTTER_VERSION: "3.41.2"
  MAC_SHARED_LOCK: ${{ vars.MAC_SHARED_LOCK }}

jobs:
  changes:
    name: Detect path changes
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - name: Refuse self-hosted for untrusted PRs
        if: >-
          runner.environment == 'self-hosted' &&
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing self-hosted/Mac runner for fork PR (public-repo safety). Portable CI must stay on ubuntu-latest."
          exit 1
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            smoke:
              - 'tashil_web/**'
              - 'e2e/**'
              - 'scripts/ci_detect_flutter.sh'
              - 'scripts/ci_flutter_arch.sh'
              - 'scripts/ci_assert_flutter_arm64.sh'
              - 'scripts/ci_install_flutter_macos_arm64.sh'
              - 'scripts/ci_runner_env.sh'
              - 'scripts/ci_pub_cache_isolation_test.sh'
              - 'scripts/pick_free_ports.py'
              - 'scripts/spa_http_server.py'
              - 'scripts/wait_ci_flutter_before_smoke.sh'
              - 'scripts/wait_mac_heavy_free.sh'
              - '.github/workflows/**'

  # Wait: always join after `changes` succeeds so the smoke gate never sees
  # needs.wait-ci-flutter.result=abandoned (main #72 / PR #73). Path skip is a
  # cheap no-op; output run_smoke drives whether smoke-run is scheduled.
  wait-ci-flutter:
    name: Wait for CI Flutter before smoke
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success'
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    # Never hold a runner for hours (was 100m Mac busy-wait).
    timeout-minutes: 45
    outputs:
      run_smoke: ${{ steps.want.outputs.run }}
    steps:
      - name: Refuse self-hosted for untrusted PRs
        if: >-
          runner.environment == 'self-hosted' &&
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing self-hosted/Mac runner for fork PR (public-repo safety). Portable CI must stay on ubuntu-latest."
          exit 1
      - name: Path filter
        id: want
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.smoke }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped — no Flutter/web/e2e/workflow path changes"
          fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
      - name: Yield to CI test-flutter on this SHA
        if: steps.want.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_CI_FLUTTER_DEADLINE_MIN: "40"
          # PR workflows use a virtual merge GITHUB_SHA; CI runs are on the head tip.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x scripts/wait_ci_flutter_before_smoke.sh
          bash scripts/wait_ci_flutter_before_smoke.sh

  # Smoke run: schedule only when wait-ci-flutter said run_smoke=true (keeps
  # docs-only PRs off heavy work). Depend on wait result/output — not a sibling
  # path `if:` on changes.outputs — so the job cannot drop out as abandoned while
  # the always() gate still runs (seen on #73 tip b3b9ca5).
  smoke-run:
    needs: [wait-ci-flutter]
    if: always() && !cancelled() && needs.wait-ci-flutter.result == 'success' && needs.wait-ci-flutter.outputs.run_smoke == 'true'
    # No job concurrency group (unchanged). Hosted ubuntu by default.
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    # Build web + Playwright (~15–25m healthy) + lock wait; acquire step < job.
    timeout-minutes: 45
    steps:
      - name: Refuse self-hosted for untrusted PRs
        if: >-
          runner.environment == 'self-hosted' &&
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing self-hosted/Mac runner for fork PR (public-repo safety). Portable CI must stay on ubuntu-latest."
          exit 1
      - uses: actions/checkout@v4

      - name: Per-runner toolchain / ADB env
        run: bash scripts/ci_runner_env.sh

      - name: Assert PUB_CACHE isolation
        run: |
          chmod +x scripts/ci_pub_cache_isolation_test.sh
          bash scripts/ci_pub_cache_isolation_test.sh --assert
          bash scripts/ci_pub_cache_isolation_test.sh

      - name: Acquire Mac resource lock
        id: mac_lock
        timeout-minutes: 15
        run: |
          set -euo pipefail
          AGENT="ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}"
          echo "MAC_LOCK_AGENT=${AGENT}" >> "$GITHUB_ENV"
          chmod +x scripts/mac_lock_ci.sh
          bash scripts/mac_lock_ci.sh acquire "$AGENT" "omar-fathalla/Tashil-Data-Sharing" "playwright-semantics-smoke" 25 15

      # Hosted ubuntu: pin Flutter via flutter-action (no Mac toolchain paths).
      - uses: subosito/flutter-action@v2
        timeout-minutes: 15
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-isolated-v1-${{ hashFiles('tashil_web/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pub-isolated-v1-

      - name: flutter pub get
        working-directory: tashil_web
        run: flutter pub get

      - name: flutter build web
        working-directory: tashil_web
        run: flutter build web --release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          # Linux (ubuntu-latest) needs OS deps; macOS does not.
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # SPA fallback so /adeco serves index.html (path URL strategy).
      # Prefer python3 over npx serve@14 (invalid addKeywords / bind failures).
      # Per-run free port in 5600+ (never hardcode 4173; avoid other bot 5570–5580).
      - name: Start static server
        id: smoke_server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-smoke"
          PORT="$(python3 scripts/pick_free_ports.py -n 1 --min 5600 --max 5899)"
          echo "SMOKE_PORT=${PORT}" >> "$GITHUB_ENV"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          python3 scripts/spa_http_server.py \
            --root tashil_web/build/web \
            --port "${PORT}" \
            >"$RUNNER_TEMP/playwright-smoke/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/playwright-smoke/serve.pid"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null; then
              echo "static server ready on ${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "static server failed to start on ${PORT}"
          cat "$RUNNER_TEMP/playwright-smoke/serve.log" || true
          exit 1

      - name: Run read-only login Semantics smoke
        working-directory: e2e
        env:
          BASE_ORIGIN: http://127.0.0.1:${{ steps.smoke_server.outputs.port }}
          TENANT_PATH: /adeco
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Surface failure summary
        if: failure()
        run: |
          {
            echo "## Playwright Semantics smoke failed"
            echo ""
            echo "flutter pub get / build web / Playwright smoke failed on branch \`${{ github.ref_name }}\`."
            echo "Reproduce locally:"
            echo ""
            echo '```bash'
            echo 'cd tashil_web && flutter pub get && flutter build web --release'
            echo 'cd e2e && npm ci && npx playwright test'
            echo '```'
            echo ""
            echo "Proposed next step: fix on this PR branch and push — do not auto-push fixes to main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop static server and clean local artifacts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/playwright-smoke/serve.pid" ]; then
            serve_pid="$(cat "$RUNNER_TEMP/playwright-smoke/serve.pid")"
            # Kill only the spa_http_server process this job started (and its children).
            if [ -n "$serve_pid" ] && kill -0 "$serve_pid" 2>/dev/null; then
              pkill -P "$serve_pid" 2>/dev/null || true
              kill "$serve_pid" 2>/dev/null || true
              sleep 1
              kill -9 "$serve_pid" 2>/dev/null || true
            fi
          fi
          rm -rf tashil_web/build/web e2e/test-results e2e/playwright-report \
            "$RUNNER_TEMP/playwright-smoke" 2>/dev/null || true

      - name: Release Mac resource lock
        if: always()
        run: |
          set +e
          AGENT="${MAC_LOCK_AGENT:-ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}}"
          bash scripts/mac_lock_ci.sh release "$AGENT"

  # Required-check gate: job id matches existing check name flutter-web-semantics-smoke.
  flutter-web-semantics-smoke:
    needs: [changes, wait-ci-flutter, smoke-run]
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Refuse self-hosted for untrusted PRs
        if: >-
          runner.environment == 'self-hosted' &&
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing self-hosted/Mac runner for fork PR (public-repo safety). Portable CI must stay on ubuntu-latest."
          exit 1
      - name: Evaluate smoke path filter / run result
        run: |
          set -euo pipefail
          changes_result="${{ needs.changes.result }}"
          if [[ "${changes_result}" == "abandoned" ]]; then
            echo "::error::needs.changes.result=abandoned (not in this attempt). Use 'Re-run all jobs', not 'Re-run failed jobs'."
            exit 1
          fi
          if [[ "${changes_result}" != "success" ]]; then
            echo "::error::Detect path changes failed (${changes_result})"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.smoke }}" != "true" ]]; then
            echo "Skipped — no Flutter/web/e2e/workflow path changes"
            exit 0
          fi
          wait_result="${{ needs.wait-ci-flutter.result }}"
          if [[ "${wait_result}" == "abandoned" ]]; then
            echo "::error::wait-ci-flutter was abandoned (never ran). abandoned ≠ success. Re-run all jobs."
            exit 1
          fi
          if [[ "${wait_result}" != "success" ]]; then
            echo "::error::wait-ci-flutter failed (${wait_result})"
            exit 1
          fi
          result="${{ needs.smoke-run.result }}"
          echo "smoke-run result=${result}"
          if [[ "${result}" == "abandoned" ]]; then
            echo "::error::smoke-run was abandoned (never ran). abandoned ≠ success. Re-run all jobs."
            exit 1
          fi
          if [[ "${result}" == "cancelled" ]]; then
            echo "::error::smoke-run was cancelled (not success). cancelled ≠ success."
            exit 1
          fi
          if [[ "${result}" == "skipped" ]]; then
            echo "::error::smoke-run was skipped but smoke path filter was true."
            exit 1
          fi
          [[ "${result}" == "success" ]]
