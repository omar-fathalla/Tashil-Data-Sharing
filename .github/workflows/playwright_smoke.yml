name: Playwright Semantics Smoke

# Self-hosted Mac (label tashil-mac). Fallback: set repo variable CI_RUNS_ON to '["ubuntu-latest"]'.
# See docs/ci-self-hosted.md.
on:
  push:
    branches: [main]
    paths:
      - "tashil_web/**"
      - "e2e/**"
      - ".github/workflows/playwright_smoke.yml"
  pull_request:
    paths:
      - "tashil_web/**"
      - "e2e/**"
      - ".github/workflows/playwright_smoke.yml"

# Cancel superseded runs on the same ref. deploy.yml stays cancel-in-progress: false.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  flutter-web-semantics-smoke:
    # Fallback if Mac offline: set repo variable CI_RUNS_ON to '["ubuntu-latest"]'.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect preinstalled Flutter
        id: flutter_pre
        run: |
          set -euo pipefail
          if command -v flutter >/dev/null 2>&1; then
            flutter --version || true
            if flutter --version 2>/dev/null | grep -q "${{ env.FLUTTER_VERSION }}"; then
              echo "use_action=false" >> "$GITHUB_OUTPUT"
              echo "Reusing preinstalled Flutter ${{ env.FLUTTER_VERSION }} at $(command -v flutter)"
              exit 0
            fi
          fi
          echo "use_action=true" >> "$GITHUB_OUTPUT"
          echo "Preinstalled Flutter ${{ env.FLUTTER_VERSION }} not found; will use flutter-action"

      - uses: subosito/flutter-action@v2
        if: steps.flutter_pre.outputs.use_action == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('tashil_web/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pub-

      - name: flutter pub get
        working-directory: tashil_web
        run: flutter pub get

      - name: flutter build web
        working-directory: tashil_web
        run: flutter build web --release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          # Linux (ubuntu-latest fallback) needs OS deps; macOS self-hosted does not.
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # SPA fallback so /adeco serves index.html (path URL strategy).
      # Use RUNNER_TEMP pid/log so cleanup works on the persistent Mac.
      - name: Start static server
        run: |
          mkdir -p "$RUNNER_TEMP/playwright-smoke"
          npx --yes serve@14 -s tashil_web/build/web -l 4173 \
            >"$RUNNER_TEMP/playwright-smoke/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/playwright-smoke/serve.pid"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173/" >/dev/null; then
              echo "static server ready"
              exit 0
            fi
            sleep 1
          done
          echo "static server failed to start"
          cat "$RUNNER_TEMP/playwright-smoke/serve.log" || true
          exit 1

      - name: Run read-only login Semantics smoke
        working-directory: e2e
        env:
          BASE_ORIGIN: http://127.0.0.1:4173
          TENANT_PATH: /adeco
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

      - name: Stop static server and clean local artifacts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/playwright-smoke/serve.pid" ]; then
            serve_pid="$(cat "$RUNNER_TEMP/playwright-smoke/serve.pid")"
            # Kill only the serve process this job started (and its children).
            if [ -n "$serve_pid" ] && kill -0 "$serve_pid" 2>/dev/null; then
              pkill -P "$serve_pid" 2>/dev/null || true
              kill "$serve_pid" 2>/dev/null || true
              sleep 1
              kill -9 "$serve_pid" 2>/dev/null || true
            fi
          fi
          # Drop large local build/report dirs so the persistent runner disk stays lean.
          rm -rf tashil_web/build/web e2e/test-results e2e/playwright-report \
            "$RUNNER_TEMP/playwright-smoke" 2>/dev/null || true
