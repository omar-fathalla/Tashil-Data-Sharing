# Consolidated CI: hybrid runners.
# Light/fast → GitHub-hosted (vars.CI_HOSTED_RUNNER, default ubuntu-latest).
# Heavy → Mac self-hosted (vars.CI_RUNS_ON, default ["self-hosted","macOS","tashil-mac"]).
# NEVER use GitHub-hosted macOS runners (macos-latest) — expensive.
#
# Budget fallback (no code change): set CI_HOSTED_RUNNER to the same JSON array as
# CI_RUNS_ON, e.g. ["self-hosted","macOS","tashil-mac"] — ALL light jobs move to Mac.
# CI_HOSTED_RUNNER accepts a JSON string ("ubuntu-latest") or a JSON label array.
# See docs/ci-self-hosted.md.
name: CI tests

# No workflow-level paths-ignore: docs-only PRs still start the workflow so required
# check gates always report. Heavy jobs skip via dorny/paths-filter inside.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch. Never cancel main.
# deploy.yml keeps cancel-in-progress: false so production deploys are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

env:
  FLUTTER_VERSION: "3.41.2"
  # Opt-in shared Mac lock (unset on dedicated tashil-ci). Set repo variable MAC_SHARED_LOCK=1 to enable.
  MAC_SHARED_LOCK: ${{ vars.MAC_SHARED_LOCK }}

jobs:
  # Path filter so Flutter can skip on backend/docs-only PRs while required checks still report.
  # Light job → hosted by default (CI_HOSTED_RUNNER).
  changes:
    name: Detect path changes
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'tashil_web/**'
              - 'scripts/ci_detect_flutter.sh'
              - 'scripts/ci_runner_env.sh'
              - 'scripts/ci_pub_cache_isolation_test.sh'
              - '.github/workflows/ci.yml'

  # Stopgap until shared storage (#37): refuse deploy commands that omit or change the 1-instance pin.
  guard-cloud-run-one-instance:
    name: Cloud Run one-instance pin
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert deploy pins min/max=1
        run: bash scripts/check_cloud_run_one_instance.sh

  test-backend:
    name: Backend Go tests
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    # ~20m class with emulator headroom (observed github-hosted go ~6m).
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Per-runner toolchain / ADB env
        working-directory: .
        run: bash scripts/ci_runner_env.sh

      # Shared Mac lock (opt-in via MAC_SHARED_LOCK). No-ops on hosted / when unset.
      # timeout < job so if:always release runs.
      - name: Acquire Mac resource lock
        id: mac_lock
        timeout-minutes: 10
        working-directory: .
        run: |
          set -euo pipefail
          AGENT="ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}"
          echo "MAC_LOCK_AGENT=${AGENT}" >> "$GITHUB_ENV"
          chmod +x scripts/mac_lock_ci.sh
          bash scripts/mac_lock_ci.sh acquire "$AGENT" "omar-fathalla/Tashil-Data-Sharing" "backend-go+firestore-emulator" 15 10

      # On self-hosted Mac, GOMODCACHE/GOCACHE already live on the shared home disk.
      # Remote actions/cache for setup-go was ~880MB and stalled (~10m at 0 B/s).
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: backend-go/go.sum

      - name: Cache Go build
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend-go/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: go vet
        run: go vet ./...

      # Capped -p/GOMAXPROCS, per-package timeout, slowest-test summary (scripts/run_go_tests_ci.sh).
      - name: go test
        id: go_test
        working-directory: .
        env:
          CI_GO_TEST_P: ${{ vars.CI_GO_TEST_P }}
          CI_GO_TEST_GOMAXPROCS: ${{ vars.CI_GO_TEST_GOMAXPROCS }}
          CI_GO_TEST_PKG_TIMEOUT_MIN: ${{ vars.CI_GO_TEST_PKG_TIMEOUT_MIN }}
        run: |
          chmod +x scripts/run_go_tests_ci.sh
          bash scripts/run_go_tests_ci.sh

      - name: Setup Node (Firestore emulator)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Prefer the Mac's preinstalled Java 21 — setup-java downloads have 504'd from Adoptium.
      - name: Detect preinstalled Java 21
        id: java_pre
        working-directory: .
        run: |
          set -euo pipefail
          if command -v java >/dev/null 2>&1 && java -version 2>&1 | grep -Eq 'version "?21([.]|$)'; then
            echo "use_action=false" >> "$GITHUB_OUTPUT"
            echo "Reusing preinstalled Java 21:"
            java -version
            exit 0
          fi
          echo "use_action=true" >> "$GITHUB_OUTPUT"
          echo "Preinstalled Java 21 not found; will use setup-java"

      - name: Setup Java (Firestore emulator)
        if: steps.java_pre.outputs.use_action == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            firebase-emulators-${{ runner.os }}-${{ runner.arch }}-

      # Run before emulator so a flaky emulator step cannot skip this check.
      - name: live-version parse fail-safe tests
        working-directory: .
        run: python3 scripts/parse_live_backend_commit_test.py

      # Prove free-port picker works (two concurrent batches get distinct ports).
      - name: Verify free-port isolation helper
        working-directory: .
        run: python3 scripts/pick_free_ports.py --self-test

      - name: Firestore emulator product-match tests
        id: go_emulator_test
        working-directory: .
        run: |
          # Per-job free ports + unique demo project + PID-only cleanup.
          # Never assumes 8080/4000/4400/9150; never kills by process name.
          # Safe alongside other bots/runners on the same Mac (ubuntu fallback OK).
          chmod +x scripts/run_firestore_emulator_tests.sh
          GOMAXPROCS=2 bash scripts/run_firestore_emulator_tests.sh

      - name: Surface failure summary
        if: failure() && (steps.go_test.outcome == 'failure' || steps.go_emulator_test.outcome == 'failure')
        run: |
          {
            echo "## Backend tests failed"
            echo ""
            echo "\`go test ./...\` failed on branch \`${{ github.ref_name }}\`."
            echo "Reproduce locally:"
            echo ""
            echo '```bash'
            echo 'bash scripts/run_go_tests_ci.sh'
            echo 'bash scripts/run_firestore_emulator_tests.sh'
            echo '```'
            echo ""
            echo "Proposed next step: inspect the failing package output above, fix on this PR branch, and push — do not push fixes to main."
          } >> "$GITHUB_STEP_SUMMARY"

      # Ownership-based release (if: always). Parent-alive acquire avoids orphans on cancel.
      - name: Release Mac resource lock
        if: always()
        working-directory: .
        run: |
          set +e
          AGENT="${MAC_LOCK_AGENT:-ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}}"
          bash scripts/mac_lock_ci.sh release "$AGENT"

  test-flutter:
    # Heavy run only when Flutter/web/CI paths change. Required check is the gate job below.
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    # Opt-in Mac lock (MAC_SHARED_LOCK). Tradeoff when enabled: serializes vs Go/smoke.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    # 35m: up to 8m lock wait + pub/analyze/test (20m was too tight with lock).
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tashil_web
    steps:
      - uses: actions/checkout@v4

      - name: Per-runner toolchain / ADB env
        working-directory: .
        run: bash scripts/ci_runner_env.sh

      - name: Assert PUB_CACHE isolation
        working-directory: .
        run: |
          chmod +x scripts/ci_pub_cache_isolation_test.sh
          bash scripts/ci_pub_cache_isolation_test.sh --assert
          bash scripts/ci_pub_cache_isolation_test.sh

      - name: Acquire Mac resource lock
        id: mac_lock
        timeout-minutes: 8
        working-directory: .
        run: |
          set -euo pipefail
          AGENT="ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}"
          echo "MAC_LOCK_AGENT=${AGENT}" >> "$GITHUB_ENV"
          chmod +x scripts/mac_lock_ci.sh
          bash scripts/mac_lock_ci.sh acquire "$AGENT" "omar-fathalla/Tashil-Data-Sharing" "flutter-analyze-test" 12 8

      # Prefer $HOME/toolchains/flutter; never download via flutter-action on self-hosted.
      # PUB_CACHE is forced to $RUNNER_TEMP/pub-cache by scripts/ci_runner_env.sh (ignores presets).
      - name: Detect preinstalled Flutter
        id: flutter_pre
        working-directory: .
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          chmod +x scripts/ci_detect_flutter.sh
          bash scripts/ci_detect_flutter.sh

      - name: Require preinstalled Flutter on self-hosted
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment == 'self-hosted'
        run: |
          echo "::error::Preinstalled Flutter ${{ env.FLUTTER_VERSION }} missing on self-hosted runner. Install at \$HOME/toolchains/flutter — do not download via flutter-action (drops Mac runners)."
          exit 1

      - uses: subosito/flutter-action@v2
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment != 'self-hosted'
        timeout-minutes: 15
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      # Self-hosted: local PUB_CACHE only (skip remote actions/cache — stalls / races on Mac).
      # GitHub-hosted: cache the same isolated path ci_runner_env.sh sets (never ~/.pub-cache).
      - name: Cache pub dependencies
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pub-isolated-v1-${{ hashFiles('tashil_web/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pub-isolated-v1-

      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      # Cap concurrency so Go/Flutter/Playwright jobs sharing the Mac don't thrash.
      - name: flutter test
        id: flutter_test
        run: flutter test --concurrency=2

      - name: Surface failure summary
        if: failure()
        run: |
          {
            echo "## Flutter job failed"
            echo ""
            echo "Flutter analyze/test (or pub get) failed on branch \`${{ github.ref_name }}\`."
            echo "Reproduce locally:"
            echo ""
            echo '```bash'
            echo 'cd tashil_web && flutter pub get && flutter analyze && flutter test'
            echo '```'
            echo ""
            echo "Proposed next step: fix on this PR branch and push — do not auto-push fixes to main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release Mac resource lock
        if: always()
        working-directory: .
        run: |
          set +e
          AGENT="${MAC_LOCK_AGENT:-ci-Tashil-Data-Sharing-${{ github.run_id }}-${{ github.job }}}"
          bash scripts/mac_lock_ci.sh release "$AGENT"

  # Required-check gate: always reports "Flutter analyze & test" (success on path skip).
  test-flutter-gate:
    name: Flutter analyze & test
    needs: [changes, test-flutter]
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Evaluate Flutter path filter / run result
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::Detect path changes failed (${{ needs.changes.result }})"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.flutter }}" != "true" ]]; then
            echo "Skipped — no Flutter/web/workflow path changes"
            exit 0
          fi
          result="${{ needs.test-flutter.result }}"
          echo "test-flutter result=${result}"
          [[ "${result}" == "success" ]]

  comment-on-pr-failure:
    name: Comment PR when tests fail
    needs: [test-backend, test-flutter]
    if: always() && github.event_name == 'pull_request' && (needs.test-backend.result == 'failure' || needs.test-flutter.result == 'failure')
    runs-on: ${{ fromJSON(vars.CI_HOSTED_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        with:
          script: |
            const backend = '${{ needs.test-backend.result }}';
            const flutter = '${{ needs.test-flutter.result }}';
            const lines = [
              '## CI tests failed',
              '',
              `| Job | Result |`,
              `| --- | --- |`,
              `| Backend Go tests | ${backend} |`,
              `| Flutter analyze & test | ${flutter} |`,
              '',
              'Please fix on this PR branch and push. **Do not push fixes to `main`.**',
              '',
              'Reproduce:',
              '```bash',
              'bash scripts/run_go_tests_ci.sh',
              'cd tashil_web && flutter test',
              '```',
            ];
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
