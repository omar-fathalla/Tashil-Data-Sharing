# Production deploy after CI tests succeed on main (backend → Cloud Run, web → Firebase Hosting).
#
# Trigger: workflow_run of "CI tests" completed successfully on main (no runner busy-wait).
# Also workflow_dispatch for manual redeploys. Intentionally NO merge_group / push trigger —
# one deploy per green main CI run. Merge-queue required checks live in ci.yml /
# playwright_smoke.yml only.
#
# Why not push + await-ci: after #95 routed all jobs to tashil-mac, await-ci busy-waited
# ~2.5h on a Mac runner while CI gate jobs queued behind it (deadlock). workflow_run
# waits in GitHub's event bus — zero runner minutes held.
#
# TODO(billing): TEMPORARY — ALL jobs use Mac self-hosted until GitHub billing is fixed.
# Single expression CI_RUNS_ON || ["self-hosted","tashil-mac"].
# Revert: restore light/gate jobs to CI_HOSTED_RUNNER / ubuntu-latest (hybrid #56).
# NEVER use GitHub-hosted macOS runners.
# See docs/ci-self-hosted.md / #41 / #55 / #56.
#
# Note: tashil-mac … tashil-mac-4 share one physical Mac. Workflow concurrency queues
# deploys; deploy-backend/web also join job group tashil-deploy (deploy-only — not
# shared with Flutter/smoke, which queue natively to avoid pending-slot eviction).
# Prefer MAC_SHARED_LOCK=1 for cross-repo Mac overlap. See docs/ci-self-hosted.md.
#
# Auth: Workload Identity Federation, no JSON keys. The provider only accepts tokens from
# omar-fathalla/Tashil-Data-Sharing on refs/heads/main, impersonating tashil-gh-deployer.
#
# Tests: do not duplicate ci.yml go/flutter on Mac — workflow_run only fires after CI green.
# Smoke: hard-fail /api/v1/version + /livez + /api/v1/health (public probes; not /healthz).
#
# Skip: deploy-gate ignores docs/md/LICENSE/.gitignore and .github/workflows/** so CI-only
# workflow edits (and docs-only pushes) do not deploy. workflow_run cannot use paths-ignore.
#
# Web version: CI never commits back to main (that would re-trigger this workflow). The version
# shown in the sidebar is computed as  <tashil_web/deploy_version.txt> + <github.run_number>,
# so it keeps increasing from the last manual deploy (v22). See docs/DEPLOY.md.
name: Deploy production

on:
  workflow_run:
    workflows: ["CI tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy queue for this workflow; never cancel an in-flight production deploy (#55).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  PROJECT_ID: tashil-data-sharing
  REGION: europe-west1
  SERVICE: tashil-backend
  WIF_PROVIDER: projects/564362209163/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: tashil-gh-deployer@tashil-data-sharing.iam.gserviceaccount.com
  FLUTTER_VERSION: "3.41.2"

jobs:
  # Tiny gate: confirm CI success context + skip ignored paths. No busy-wait.
  # TODO(billing): TEMP — was CI_HOSTED_RUNNER / ubuntu-latest.
  deploy-gate:
    name: Deploy gate
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "tashil-mac"]') }}
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: deploy the CI-green commit, not whatever tip holds this YAML.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether to deploy
        id: decide
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy SHA=${SHA}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: always deploy"
            exit 0
          fi

          # Mirror former push paths-ignore + .github/workflows/** (workflow_run has no paths filter).
          # Avoid mapfile — macOS /bin/bash is 3.2.
          if git rev-parse --verify -q HEAD^ >/dev/null; then
            file_list="$(git diff --name-only --diff-filter=ACDMRTUXB HEAD^ HEAD)"
          else
            file_list="$(git ls-tree -r --name-only HEAD)"
          fi

          if [ -z "${file_list}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No changed files vs parent; skipping deploy"
            exit 0
          fi

          should_deploy=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              LICENSE|.gitignore) continue ;;
            esac
            case "$f" in
              *.md|docs/*|.github/workflows/*) continue ;;
            esac
            should_deploy=true
            break
          done < <(printf '%s\n' "${file_list}")

          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"
          if [ "${should_deploy}" = "true" ]; then
            echo "Non-ignored paths changed; proceed with deploy"
            printf 'Changed files:\n%s\n' "${file_list}"
          else
            echo "Only ignored paths changed (docs/md/LICENSE/.gitignore/.github/workflows); skipping deploy"
            printf 'Ignored files:\n%s\n' "${file_list}"
          fi

  deploy-backend:
    needs: [deploy-gate]
    if: needs.deploy-gate.outputs.should_deploy == 'true'
    # Stay on Mac/self-hosted where gcloud WIF + toolchains work (#41 / #55 / #56).
    # Deploy-only concurrency (not shared with Flutter/smoke). Never cancel.
    concurrency:
      group: tashil-deploy
      cancel-in-progress: false
    # TODO(billing): TEMP — same Mac expression as other jobs (was already Mac).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "tashil-mac"]') }}
    # Observed ~4.5m; Cloud Run source deploy can spike — 30m ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy-gate.outputs.sha }}
          # Need history to decide whether backend sources changed vs live.
          fetch-depth: 0

      - name: Pin deploy SHA
        run: |
          set -euo pipefail
          echo "DEPLOY_SHA=${{ needs.deploy-gate.outputs.sha }}" >> "$GITHUB_ENV"
          echo "Deploying commit ${{ needs.deploy-gate.outputs.sha }}"

      - name: Deploy backend smoke unit test
        run: |
          chmod +x scripts/deploy_backend_smoke.sh scripts/deploy_backend_smoke_test.sh
          bash scripts/deploy_backend_smoke_test.sh

      - name: Per-runner toolchain env
        run: bash scripts/ci_runner_env.sh

      # runner.* is not allowed in jobs.*.env — set via $RUNNER_TEMP in a step.
      - name: Isolate gcloud config
        run: |
          set -euo pipefail
          cfg="${RUNNER_TEMP}/cloudsdk-config-deploy-backend"
          mkdir -p "$cfg"
          echo "CLOUDSDK_CONFIG=${cfg}" >> "$GITHUB_ENV"

      - name: Detect whether backend must redeploy
        id: backend_paths
        env:
          BACKEND_VERSION_URL: https://tashil-backend-564362209163.europe-west1.run.app/api/v1/version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: always redeploy backend"
            exit 0
          fi

          # Compare against the commit actually serving production — not github.event.before.
          # That way a failed backend deploy followed by a web-only push still redeploys backend.
          # Malformed/empty live JSON must fail-safe to deploy=true (never abort the job).
          live_json="$(curl -fsS --retry 5 --retry-delay 3 "$BACKEND_VERSION_URL" || true)"
          live_commit="$(printf '%s' "${live_json}" | python3 "${GITHUB_WORKSPACE}/scripts/parse_live_backend_commit.py")"
          if [ -z "${live_commit}" ] || [ "${live_commit}" = "unknown" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Could not read live /api/v1/version git_commit (empty/malformed/unreachable); redeploying backend"
            exit 0
          fi
          if [ "${live_commit}" = "${DEPLOY_SHA}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Live backend already on ${DEPLOY_SHA:0:7}; skipping Cloud Run deploy"
            exit 0
          fi
          if ! git cat-file -e "${live_commit}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Live commit ${live_commit:0:7} not in history; redeploying backend"
            exit 0
          fi
          if git diff --quiet "${live_commit}" "${DEPLOY_SHA}" -- backend-go/ .github/workflows/deploy.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "backend-go/ and deploy.yml unchanged vs live ${live_commit:0:7}; skipping Cloud Run deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Backend paths differ from live ${live_commit:0:7}; redeploying Cloud Run"
          fi

      - id: auth
        if: steps.backend_paths.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      # Prefer $HOME/toolchains/google-cloud-sdk (tashil-ci); no apt.
      - name: Ensure gcloud on PATH
        id: gcloud_path
        if: steps.backend_paths.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          SDK="${HOME}/toolchains/google-cloud-sdk"
          if [ -x "${SDK}/bin/gcloud" ]; then
            echo "${SDK}/bin" >> "$GITHUB_PATH"
            echo "Using preinstalled gcloud at ${SDK}"
            "${SDK}/bin/gcloud" version
            echo "need_setup_gcloud=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v gcloud >/dev/null 2>&1; then
            echo "Using gcloud already on PATH: $(command -v gcloud)"
            gcloud version
            echo "need_setup_gcloud=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Preinstalled gcloud not found; installing via setup-gcloud action"
          echo "need_setup_gcloud=true" >> "$GITHUB_OUTPUT"

      - name: Setup gcloud (fallback)
        if: steps.backend_paths.outputs.deploy == 'true' && steps.gcloud_path.outputs.need_setup_gcloud == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Record git commit for /api/v1/version
        if: steps.backend_paths.outputs.deploy == 'true'
        run: echo "${DEPLOY_SHA}" > backend-go/data/build_commit.txt

      - name: Deploy to Cloud Run (from source, existing settings and env vars are kept)
        if: steps.backend_paths.outputs.deploy == 'true'
        working-directory: backend-go
        run: |
          # Pin to 1 instance until shared storage lands (#37); relax min/max after that.
          # Pin cpu/memory to match live revision (owner-set 2 CPU / 4Gi) so future deploys keep it.
          gcloud run deploy "$SERVICE" --source . \
            --region "$REGION" --project "$PROJECT_ID" --quiet \
            --update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --cpu=2 \
            --memory=4Gi \
            --min-instances=1 \
            --max-instances=1

      - name: Smoke check
        if: steps.backend_paths.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          chmod +x scripts/deploy_backend_smoke.sh
          # Hard-fail non-200 on /api/v1/version, /livez, /api/v1/health (public; not /healthz).
          bash scripts/deploy_backend_smoke.sh "$url"

      - name: Skip summary
        if: steps.backend_paths.outputs.deploy != 'true'
        run: echo "Skipped Cloud Run deploy (web-only / non-backend change)." >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: [deploy-gate, deploy-backend]
    concurrency:
      group: tashil-deploy
      cancel-in-progress: false
    # TODO(billing): TEMP — same Mac expression as other jobs (was already Mac).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "tashil-mac"]') }}
    # Observed ~3m (flutter build + Firebase Hosting); 30m ceiling (Mac timeout policy).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy-gate.outputs.sha }}

      - name: Pin deploy SHA
        run: |
          set -euo pipefail
          echo "DEPLOY_SHA=${{ needs.deploy-gate.outputs.sha }}" >> "$GITHUB_ENV"

      - name: Per-runner toolchain env
        run: bash scripts/ci_runner_env.sh

      # runner.* is not allowed in jobs.*.env — set via $RUNNER_TEMP in a step.
      - name: Isolate gcloud config
        run: |
          set -euo pipefail
          cfg="${RUNNER_TEMP}/cloudsdk-config-deploy-web"
          mkdir -p "$cfg"
          echo "CLOUDSDK_CONFIG=${cfg}" >> "$GITHUB_ENV"

      - name: Detect preinstalled Flutter
        id: flutter_pre
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          chmod +x scripts/ci_detect_flutter.sh scripts/ci_flutter_arch.sh
          bash scripts/ci_detect_flutter.sh

      - name: Require preinstalled Flutter on self-hosted
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment == 'self-hosted'
        run: |
          echo "::error::Preinstalled Flutter ${{ env.FLUTTER_VERSION }} missing on self-hosted runner. Install native arm64 at \$HOME/toolchains/flutter-arm64 via scripts/ci_install_flutter_macos_arm64.sh — do not download via flutter-action (drops Mac runners)."
          exit 1

      - name: Require native arm64 Flutter on Apple Silicon
        if: steps.flutter_pre.outputs.use_action == 'false' && runner.environment == 'self-hosted'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          chmod +x scripts/ci_assert_flutter_arm64.sh scripts/ci_flutter_arch.sh
          bash scripts/ci_assert_flutter_arm64.sh

      - uses: subosito/flutter-action@v2
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment != 'self-hosted'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Compute web version
        id: ver
        run: |
          base="$(tr -dc '0-9' < tashil_web/deploy_version.txt)"
          echo "version=$(( ${base:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Build web
        working-directory: tashil_web
        run: |
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION="${{ steps.ver.outputs.version }}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Summary
        run: echo "Deployed web v${{ steps.ver.outputs.version }} (commit ${DEPLOY_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
