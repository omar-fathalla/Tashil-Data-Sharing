# Production deploy on every push to main (backend → Cloud Run, web → Firebase Hosting).
#
# Self-hosted Mac (same CI_RUNS_ON / tashil-mac as ci.yml). GitHub-hosted ubuntu was
# blocked by spending limits — see docs/ci-self-hosted.md / #41.
# Fallback: set repo variable CI_RUNS_ON to '["ubuntu-latest"]'.
#
# Auth: Workload Identity Federation, no JSON keys. The provider only accepts tokens from
# omar-fathalla/Tashil-Data-Sharing on refs/heads/main, impersonating tashil-gh-deployer.
#
# Web version: CI never commits back to main (that would re-trigger this workflow). The version
# shown in the sidebar is computed as  <tashil_web/deploy_version.txt> + <github.run_number>,
# so it keeps increasing from the last manual deploy (v22). See docs/DEPLOY.md.
name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# One deploy queue for this workflow; never cancel an in-flight production deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: tashil-data-sharing
  REGION: europe-west1
  SERVICE: tashil-backend
  WIF_PROVIDER: projects/564362209163/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: tashil-gh-deployer@tashil-data-sharing.iam.gserviceaccount.com
  FLUTTER_VERSION: "3.41.2"

jobs:
  test-backend:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    # Observed ~6m on success (2026-11-08 deploy); ~20m ceiling.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner toolchain env
        working-directory: .
        run: bash scripts/ci_runner_env.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: backend-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -timeout 20m

  test-web:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    # Observed ~4.5m on success; ~20m ceiling.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tashil_web
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner toolchain env
        working-directory: .
        run: bash scripts/ci_runner_env.sh
      - name: Detect preinstalled Flutter
        id: flutter_pre
        working-directory: .
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          chmod +x scripts/ci_detect_flutter.sh
          bash scripts/ci_detect_flutter.sh
      - name: Require preinstalled Flutter on self-hosted
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment == 'self-hosted'
        run: |
          echo "::error::Preinstalled Flutter ${{ env.FLUTTER_VERSION }} missing on self-hosted runner. Install at \$HOME/toolchains/flutter — do not download via flutter-action (drops Mac runners)."
          exit 1
      - uses: subosito/flutter-action@v2
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment != 'self-hosted'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  deploy-backend:
    needs: [test-backend, test-web]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    # Observed ~4.5m; Cloud Run source deploy can spike — 30m ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to decide whether backend sources changed.
          fetch-depth: 0
      - name: Per-runner toolchain env
        run: bash scripts/ci_runner_env.sh
      - name: Isolate gcloud config
        run: |
          set -euo pipefail
          cfg="${RUNNER_TEMP}/cloudsdk-config-deploy-backend"
          mkdir -p "$cfg"
          echo "CLOUDSDK_CONFIG=${cfg}" >> "$GITHUB_ENV"
      - name: Detect whether backend must redeploy
        id: backend_paths
        env:
          BACKEND_VERSION_URL: https://tashil-backend-564362209163.europe-west1.run.app/api/v1/version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: always redeploy backend"
            exit 0
          fi

          # Compare against the commit actually serving production — not github.event.before.
          # That way a failed backend deploy followed by a web-only push still redeploys backend.
          # Malformed/empty live JSON must fail-safe to deploy=true (never abort the job).
          live_json="$(curl -fsS --retry 5 --retry-delay 3 "$BACKEND_VERSION_URL" || true)"
          live_commit="$(printf '%s' "${live_json}" | python3 "${GITHUB_WORKSPACE}/scripts/parse_live_backend_commit.py")"
          if [ -z "${live_commit}" ] || [ "${live_commit}" = "unknown" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Could not read live /api/v1/version git_commit (empty/malformed/unreachable); redeploying backend"
            exit 0
          fi
          if [ "${live_commit}" = "${GITHUB_SHA}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Live backend already on ${GITHUB_SHA:0:7}; skipping Cloud Run deploy"
            exit 0
          fi
          if ! git cat-file -e "${live_commit}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Live commit ${live_commit:0:7} not in history; redeploying backend"
            exit 0
          fi
          if git diff --quiet "${live_commit}" "${GITHUB_SHA}" -- backend-go/ .github/workflows/deploy.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "backend-go/ and deploy.yml unchanged vs live ${live_commit:0:7}; skipping Cloud Run deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Backend paths differ from live ${live_commit:0:7}; redeploying Cloud Run"
          fi
      - id: auth
        if: steps.backend_paths.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      # Prefer $HOME/toolchains/google-cloud-sdk (tashil-ci); no apt.
      - name: Ensure gcloud on PATH
        id: gcloud_path
        if: steps.backend_paths.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          SDK="${HOME}/toolchains/google-cloud-sdk"
          if [ -x "${SDK}/bin/gcloud" ]; then
            echo "${SDK}/bin" >> "$GITHUB_PATH"
            echo "Using preinstalled gcloud at ${SDK}"
            "${SDK}/bin/gcloud" version
            echo "need_setup_gcloud=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v gcloud >/dev/null 2>&1; then
            echo "Using gcloud already on PATH: $(command -v gcloud)"
            gcloud version
            echo "need_setup_gcloud=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Preinstalled gcloud not found; installing via setup-gcloud action"
          echo "need_setup_gcloud=true" >> "$GITHUB_OUTPUT"
      - name: Setup gcloud (fallback)
        if: steps.backend_paths.outputs.deploy == 'true' && steps.gcloud_path.outputs.need_setup_gcloud == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Record git commit for /api/v1/version
        if: steps.backend_paths.outputs.deploy == 'true'
        run: echo "${GITHUB_SHA}" > backend-go/data/build_commit.txt
      - name: Deploy to Cloud Run (from source, existing settings and env vars are kept)
        if: steps.backend_paths.outputs.deploy == 'true'
        working-directory: backend-go
        run: |
          # Pin to 1 instance until shared storage lands (#37); relax min/max after that.
          gcloud run deploy "$SERVICE" --source . \
            --region "$REGION" --project "$PROJECT_ID" --quiet \
            --update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --memory=2Gi \
            --min-instances=1 \
            --max-instances=1
      - name: Smoke check
        if: steps.backend_paths.outputs.deploy == 'true'
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          # /livez is public and Cloud Run-safe (/healthz is reserved by Google ingress).
          curl -fsS --retry 5 --retry-delay 10 "$url/livez"
          curl -fsS --retry 5 --retry-delay 10 "$url/api/v1/health"
      - name: Skip summary
        if: steps.backend_paths.outputs.deploy != 'true'
        run: echo "Skipped Cloud Run deploy (web-only / non-backend change)." >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: [deploy-backend]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "tashil-mac"]') }}
    # Observed ~3m (flutter build + Firebase Hosting); 25m ceiling.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner toolchain env
        run: bash scripts/ci_runner_env.sh
      - name: Detect preinstalled Flutter
        id: flutter_pre
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          chmod +x scripts/ci_detect_flutter.sh
          bash scripts/ci_detect_flutter.sh
      - name: Require preinstalled Flutter on self-hosted
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment == 'self-hosted'
        run: |
          echo "::error::Preinstalled Flutter ${{ env.FLUTTER_VERSION }} missing on self-hosted runner. Install at \$HOME/toolchains/flutter — do not download via flutter-action (drops Mac runners)."
          exit 1
      - uses: subosito/flutter-action@v2
        if: steps.flutter_pre.outputs.use_action == 'true' && runner.environment != 'self-hosted'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Compute web version
        id: ver
        run: |
          base="$(tr -dc '0-9' < tashil_web/deploy_version.txt)"
          echo "version=$(( ${base:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"
      - name: Build web
        working-directory: tashil_web
        run: |
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION="${{ steps.ver.outputs.version }}"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive
      - name: Summary
        run: echo "Deployed web v${{ steps.ver.outputs.version }} (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
