name: Actions storage cleanup

# Scheduled retention for GitHub Actions artifacts, startup_failure runs, and caches.
# Manual runs default to dry_run (list/count only). GITHUB_TOKEN only; no secrets.
on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List targets only; do not delete"
        type: boolean
        required: true
        default: true

permissions:
  actions: write
  contents: read

env:
  RETENTION_DAYS: 7
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

jobs:
  cleanup:
    name: Clean Actions storage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run retention cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const retentionDays = parseInt(process.env.RETENTION_DAYS, 10);
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
            const createdBefore = new Date(cutoff).toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MAX_DELETES = 1000;

            const bytesToMb = (n) => (n / (1024 * 1024)).toFixed(2);

            const olderThanCutoff = (iso) => {
              if (!iso) return false;
              return Date.parse(iso) < cutoff;
            };

            const deleteBatch = async (label, items, deleteOne) => {
              const candidateCount = items.length;
              const candidateBytes = items.reduce((s, i) => s + (i.bytes ?? 0), 0);
              if (dryRun) {
                console.log(
                  `${label} summary: candidates=${candidateCount} candidate_mb=${bytesToMb(candidateBytes)} deleted=0 failed=0 skipped_cap=0`
                );
                return;
              }
              const batch = items.slice(0, MAX_DELETES);
              const skippedCap = Math.max(0, candidateCount - batch.length);
              let deleted = 0;
              let failed = 0;
              for (const item of batch) {
                try {
                  await deleteOne(item);
                  deleted += 1;
                } catch (err) {
                  failed += 1;
                  const status = err.status ?? err.response?.status;
                  if (status === 404 || status === 403) {
                    console.log(`[${label}] delete failed id=${item.id} status=${status}`);
                  } else {
                    console.log(`[${label}] delete failed id=${item.id} error=${err.message}`);
                  }
                }
              }
              console.log(
                `${label} summary: candidates=${candidateCount} candidate_mb=${bytesToMb(candidateBytes)} deleted=${deleted} failed=${failed} skipped_cap=${skippedCap}`
              );
            };

            console.log(
              `Mode: ${dryRun ? 'DRY RUN (no deletions)' : 'LIVE DELETE'}; cutoff older than ${retentionDays}d (${new Date(cutoff).toISOString()}); run created filter <${createdBefore}`
            );

            // --- Artifacts (created_at): collect, then delete ---
            const artifactCandidates = [];
            let artifactPage = 1;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100,
                page: artifactPage,
              });
              if (!data.artifacts.length) break;
              for (const art of data.artifacts) {
                if (!olderThanCutoff(art.created_at)) continue;
                artifactCandidates.push({
                  id: art.id,
                  bytes: art.size_in_bytes ?? 0,
                  art,
                });
                console.log(
                  `[artifact] id=${art.id} name=${art.name} created=${art.created_at} size_mb=${bytesToMb(art.size_in_bytes ?? 0)}`
                );
              }
              if (data.artifacts.length < 100) break;
              artifactPage += 1;
            }
            await deleteBatch('Artifacts', artifactCandidates, async (item) => {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: item.id,
              });
            });

            // --- Workflow runs: completed + created filter; startup_failure only ---
            const runCandidates = [];
            let runPage = 1;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                status: 'completed',
                created: `<${createdBefore}`,
                per_page: 100,
                page: runPage,
              });
              const runs = data.workflow_runs ?? [];
              if (!runs.length) break;
              for (const run of runs) {
                if (run.conclusion !== 'startup_failure') continue;
                if (!olderThanCutoff(run.created_at)) continue;
                runCandidates.push({ id: run.id, bytes: 0, run });
                console.log(
                  `[startup_failure run] id=${run.id} workflow=${run.name} created=${run.created_at}`
                );
              }
              if (runs.length < 100) break;
              runPage += 1;
            }
            await deleteBatch('startup_failure runs', runCandidates, async (item) => {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: item.id,
              });
            });

            // --- Actions caches (last_accessed_at) ---
            const cacheCandidates = [];
            let cachePage = 1;
            while (true) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page: cachePage,
              });
              const caches = data.actions_caches ?? [];
              if (!caches.length) break;
              for (const cache of caches) {
                if (!olderThanCutoff(cache.last_accessed_at)) continue;
                cacheCandidates.push({
                  id: cache.id,
                  bytes: cache.size_in_bytes ?? 0,
                  cache,
                });
                console.log(
                  `[cache] id=${cache.id} key=${cache.key} last_accessed=${cache.last_accessed_at} size_mb=${bytesToMb(cache.size_in_bytes ?? 0)}`
                );
              }
              if (caches.length < 100) break;
              cachePage += 1;
            }
            await deleteBatch('Caches', cacheCandidates, async (item) => {
              await github.rest.actions.deleteActionsCacheById({
                owner,
                repo,
                cache_id: item.id,
              });
            });

            console.log('Skipped by policy: releases, packages, branches, non-startup_failure runs.');

      - name: Summarize (gh api spot-check)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN}"
          echo "Repo artifact total_count (all ages):"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count'
          echo "Repo actions cache total_count (all ages):"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=1" --jq '.total_count'