# Backend Go CI on pull requests and main pushes.
name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - ".github/workflows/go_ci.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend-go/**"
      - ".github/workflows/go_ci.yml"
      - ".github/workflows/deploy.yml"

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -timeout 20m
