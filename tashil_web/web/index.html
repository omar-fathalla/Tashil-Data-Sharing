<!DOCTYPE html>
<html dir="rtl" lang="ar" data-app-version="__TASHIL_APP_VERSION__">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tashil Data Sharing Platform">
  <meta name="theme-color" content="#35A211">

  <!-- Favicon & Browser Tab Icons (Cache-busted for immediate browser refresh) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261016b">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=20261016b">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=20261016b">
  <link rel="shortcut icon" href="favicon.ico?v=20261016b">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tashil Data Sharing">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261016b">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=20261016b">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=20261016b">

  <!-- Google Fonts Preconnect & Cairo Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Tashil Data Sharing</title>
  <link rel="manifest" href="manifest.json?v=20261016b">
</head>
<body>
  <!-- Persistent #tashil-file-input is created by WebFileHelper.ensureMounted after first frame. -->
  <script>
    (function () {
      var baked = document.documentElement.getAttribute('data-app-version') || '';
      if (baked === '__TASHIL_APP_VERSION__') baked = '';
      var onceKey = 'tashil_reload_' + (baked || 'unknown');
      function clearWorkersAndCaches() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        return Promise.all(tasks);
      }
      clearWorkersAndCaches();
      fetch('version.json?t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (info) {
          if (!info) return;
          var live = String(info.app_version || '');
          if (!live || !baked || live === baked) return;
          if (sessionStorage.getItem(onceKey)) return;
          sessionStorage.setItem(onceKey, '1');
          return clearWorkersAndCaches().then(function () {
            var url = new URL(window.location.href);
            url.searchParams.set('v', live);
            window.location.replace(url.toString());
          });
        })
        .catch(function () {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
